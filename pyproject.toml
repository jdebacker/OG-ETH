[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ogeth"
version = "0.0.8"
authors = [
    {name = "Marcelo LaFleur, Richard W. Evans, and Jason DeBacker"},
]
description = "Ethiopia Calibration for OG-Core"
readme = "README.md"
license = {text = "CC0 1.0 Universal (CC0 1.0) Public Domain Dedication"}
requires-python = ">=3.11, <3.14"
keywords = [
    "ETH",
    "Ethiopia",
    "calibration",
    "overlapping generations",
    "fiscal policy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "psutil",
    "scipy>=1.7.1",
    "pandas>=1.2.5",
    "matplotlib",
    "dask>=2.30.0",
    "distributed>=2.30.1",
    "paramtools>=0.20.0",
    "requests",
    "xlwt",
    "openpyxl>=3.1.2",
    "statsmodels",
    "linearmodels",
    "linecheck",
    "ogcore>=0.14.11",
]

[project.urls]
Homepage = "https://github.com/EAPD-DRB/OG-ETH/"
"Issue Tracker" = "https://github.com/EAPD-DRB/OG-ETH/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-xdist",
    "coverage",
    "ruff",
    "ipython",
    "ipykernel",
    "jupyter",
]
docs = [
    "jupyter-book<2.0.0",
    "sphinx>=3.5.4",
    "sphinx-book-theme>=0.1.3",
    "sphinx-argparse",
    "sphinx-exercise",
    "sphinx-proof",
    "sphinxcontrib-bibtex>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["ogeth*"]

[tool.setuptools.package-data]
ogeth = [
    "ogeth_default_parameters.json",
    "ogeth_multi_industry_parameters.json",
    "data/*",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
# Package re-exports via star imports are intentional public API surface.
"ogeth/__init__.py" = ["F401", "F403"]
# Known dead-code reference to undefined `abil_wgts`; tracked separately
# from the uv migration -- TODO: fix or remove the unreachable branch.
"ogeth/income.py" = ["F821"]
# `I` mirrors the Specifications attribute `p.I` (number of consumption goods)
# to keep mock setup readable; renaming would obscure intent.
"tests/test_calibrate.py" = ["E741"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
markers = [
    "local: marks tests that are run locally only and not on GH Actions",
]
